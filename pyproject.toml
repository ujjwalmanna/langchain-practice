[project]
name = "langchn-practise"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aia-auth-client==0.0.10",
    "chromadb>=1.5.9",
    "ddgs>=9.16.0",
    "dotenv>=0.9.9",
    "jupyter>=1.1.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.4",
    "langchain-openai>=1.6.4",
    "langgraph>=1.2.12",
    "langgraph-prebuilt>=1.1.0",
    "langgraph-sdk>=0.4.5",
    "openai>=3.19.0",
    "pyppeteer>=0.0.25",
    "wikipedia>=1.4.0",
]

[project.scripts]
langchn-practise = "langchn_practise:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
